input { beats { port => 5044 } }
filter {
  if [winlog] {
    mutate { add_field => { "[event][dataset]" => "windows.eventlog" } }
    if [winlog][event_id] {
      mutate { replace => { "[event][code]" => "%{[winlog][event_id]}" } }
    }
    if [event][code] in ["4624", "4625", "4776"] {
      mutate { add_field => { "[event][category]" => "authentication" } }
    }
    if [event][code] == "4625" {
      mutate { replace => { "[event][outcome]" => "failure" } }
    } else if [event][code] == "4624" {
      mutate { replace => { "[event][outcome]" => "success" } }
    }
    if [winlog][event_data][IpAddress] and [winlog][event_data][IpAddress] != "-" {
      mutate { copy => { "[winlog][event_data][IpAddress]" => "[source][address]" } }
    }
    if [winlog][event_data][TargetUserName] {
      mutate { copy => { "[winlog][event_data][TargetUserName]" => "[user][name]" } }
    }
    if [winlog][channel] == "OpenSSH/Operational" {
      mutate { add_field => { "[event][category]" => "authentication" } }
    }
  }
  if [event][dataset] == "linux.auth" {
    grok {
      match => { "message" => [
        "%{SYSLOGTIMESTAMP} %{HOSTNAME} sshd\[%{POSINT}\]: Failed password for (invalid user )?%{NOTSPACE:[user][name]} from %{IP:[source][ip]} port %{INT:[source][port]}%{GREEDYDATA}",
        "%{SYSLOGTIMESTAMP} %{HOSTNAME} sshd\[%{POSINT}\]: Accepted password for %{NOTSPACE:[user][name]} from %{IP:[source][ip]} port %{INT:[source][port]}%{GREEDYDATA}"
      ] }
      tag_on_failure => []
    }
    if "Failed password" in [message] {
      mutate { add_field => { "[event][category]" => "authentication" "[event][outcome]" => "failure" } }
    } else if "Accepted password" in [message] {
      mutate { add_field => { "[event][category]" => "authentication" "[event][outcome]" => "success" } }
    }
  }
  if [event][dataset] == "linux.ftp" {
    if "FAIL LOGIN" in [message] {
      mutate { add_field => { "[event][category]" => "authentication" "[event][outcome]" => "failure" } }
      grok {
        match => { "message" => "\[%{NOTSPACE:[user][name]}\] FAIL LOGIN: Client \"%{IP:[source][ip]}\"" }
        tag_on_failure => []
      }
    } else if "OK LOGIN" in [message] {
      mutate { add_field => { "[event][category]" => "authentication" "[event][outcome]" => "success" } }
      grok {
        match => { "message" => "\[%{NOTSPACE:[user][name]}\] OK LOGIN: Client \"%{IP:[source][ip]}\"" }
        tag_on_failure => []
      }
    }
  }
  if [event][dataset] == "windows.ftp" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:ftp_time} %{IP:[source][ip]} (?:%{NOTSPACE:[user][name]}|-) %{IP:[destination][ip]} %{INT:[destination][port]} %{WORD:ftp_command} %{NOTSPACE:ftp_arg} %{INT:ftp_status}%{GREEDYDATA}" }
      tag_on_failure => []
    }
    if [ftp_status] == "530" {
      mutate { add_field => { "[event][category]" => "authentication" "[event][outcome]" => "failure" } }
    } else if [ftp_status] == "230" {
      mutate { add_field => { "[event][category]" => "authentication" "[event][outcome]" => "success" } }
    }
  }
  if [event][dataset] == "linux.web" {
    json { source => "message" target => "[web]" }
    if [web][time] {
      date { match => ["[web][time]", "ISO8601"] }
      mutate {
        rename => {
          "[web][ip]" => "[source][ip]"
          "[web][method]" => "[http][request][method]"
          "[web][uri]" => "[url][original]"
          "[web][status]" => "[http][response][status_code]"
        }
        convert => { "[http][response][status_code]" => "integer" }
        add_field => { "[event][category]" => "web" }
      }
    }
  }
  if ![event][dataset] { mutate { add_field => { "[event][dataset]" => "unknown" } } }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "soc-%{+YYYY.MM.dd}"
    ilm_enabled => false
    manage_template => false
  }
}

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log

[program:rsyslog]
command=/usr/sbin/rsyslogd -n
priority=10
autorestart=true

[program:mariadb]
command=/usr/sbin/mariadbd --user=mysql
priority=15
autorestart=true

[program:php-fpm]
command=/usr/sbin/php-fpm8.2 -F
priority=18
autorestart=true

[program:sshd]
command=/usr/sbin/sshd -D
priority=20
autorestart=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=25
autorestart=true

[program:webapp]
command=/usr/bin/python3 /srv/web/app.py
user=www-data
priority=25
autorestart=true

[program:ftp]
command=/usr/sbin/vsftpd /etc/vsftpd.conf
priority=30
autorestart=true

[program:cron]
command=/usr/sbin/cron -f
priority=35
autorestart=true

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
[program:rsyslog]
command=/usr/sbin/rsyslogd -n
priority=10
autorestart=true
[program:sshd]
command=/usr/sbin/sshd -D
priority=20
autorestart=true
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
[program:webapp]
command=/usr/bin/python3 /srv/web/app.py
user=www-data
autorestart=true
[program:ftp]
command=/usr/sbin/vsftpd /etc/vsftpd.conf
autorestart=true
[program:cron]
command=/usr/sbin/cron -f
autorestart=true

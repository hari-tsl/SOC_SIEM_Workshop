log_format soc escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status}';

server {
  listen 80 default_server;
  server_name _;
  root /var/www/html;
  index index.php index.html;

  access_log /var/log/nginx/access.json soc;
  error_log /var/log/nginx/error.log;

  # Docker container and test healthcheck
  location /health {
    proxy_pass http://127.0.0.1:8081/health;
  }

  # SQLite catalog endpoint for backward compatibility
  location /search {
    proxy_pass http://127.0.0.1:8081/search;
  }

  # DVWA application and web traffic
  location / {
    try_files $uri $uri/ /index.php?$args;
  }

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_intercept_errors on;
  }
}

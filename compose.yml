name: soc-siem-lab
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.19.4}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes: [es-data:/usr/share/elasticsearch/data]
    networks: [backend]
    mem_limit: 2g
    healthcheck:
      test: [CMD-SHELL, "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 8s
      retries: 60
    restart: unless-stopped
    logging: *logging
  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION:-8.19.4}
    environment: {LS_JAVA_OPTS: "-Xms512m -Xmx512m"}
    volumes:
      - ./elk/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./elk/logstash/pipeline.conf:/usr/share/logstash/pipeline/main.conf:ro
      - logstash-data:/usr/share/logstash/data
    networks:
      backend: {}
      lab: {}
      windows-net: {ipv4_address: 172.30.51.10}
    depends_on: {elasticsearch: {condition: service_healthy}}
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:9600/_node/pipelines/main >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 60
    mem_limit: 1024m
    restart: unless-stopped
    logging: *logging
  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.19.4}
    volumes: [./elk/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro]
    ports: [127.0.0.1:5601:5601]
    networks: [backend]
    depends_on: {elasticsearch: {condition: service_healthy}}
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:5601/api/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 90
    mem_limit: 1g
    restart: unless-stopped
    logging: *logging
  linux-victim:
    build: ./linux-victim
    image: soc-lab/linux-victim:1.0.0
    hostname: linux-victim
    environment: {LAB_PASSWORD: "${LAB_PASSWORD:?Run start.sh first}"}
    volumes: [linux-logs:/var/log]
    networks: [lab]
    ports: [127.0.0.1:8080:80]
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost/health && pgrep -x sshd && pgrep -x vsftpd"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    logging: *logging
  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION:-8.19.4}
    user: root
    command: [filebeat, -e, --strict.perms=false]
    volumes:
      - ./linux-victim/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - linux-logs:/var/log/victim:ro
      - filebeat-data:/usr/share/filebeat/data
    networks: [lab]
    depends_on: {logstash: {condition: service_healthy}}
    restart: unless-stopped
    logging: *logging
  windows:
    build: ./windows
    image: soc-lab/windows:1.0.0
    hostname: SOC-WINDOWS
    environment:
      LAB_PASSWORD: "${LAB_PASSWORD:?Run start.sh first}"
    volumes:
      - windows-data:/storage
    networks:
      windows-net: {ipv4_address: 172.30.51.30}
    ports: [127.0.0.1:8006:8006]
    restart: unless-stopped
    logging: *logging
  windows-target:
    image: haproxy:3.0-alpine
    volumes: [./windows/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro]
    networks: [lab, windows-net]
    restart: unless-stopped
    logging: *logging
  kali:
    build: ./kali
    image: soc-lab/kali:1.0.0
    hostname: kali
    environment:
      LAB_PASSWORD: "${LAB_PASSWORD:?Run start.sh first}"
    networks: [lab]
    volumes: [kali-logs:/logs]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging
  kali-filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION:-8.19.4}
    user: root
    command: [filebeat, -e, --strict.perms=false]
    volumes:
      - ./kali/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - kali-logs:/logs:ro
      - kali-beat-data:/usr/share/filebeat/data
    networks: [lab]
    depends_on: {logstash: {condition: service_healthy}}
    restart: unless-stopped
    logging: *logging
  setup:
    image: python:3.12-slim-bookworm
    profiles: [tools]
    entrypoint: [python, /scripts/bootstrap.py]
    volumes:
      - ./scripts:/scripts:ro
      - ./elk/kibana:/kibana:ro
    networks: [backend]
networks:
  backend: {internal: true}
  lab: {internal: true}
  # Only Windows provisioning has Internet egress. Kali has no route here.
  windows-net:
    ipam:
      config: [{subnet: 172.30.51.0/24}]
volumes:
  es-data:
  logstash-data:
  linux-logs:
  filebeat-data:
  windows-data:
  kali-logs:
  kali-beat-data:

name: soc-siem-lab
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  # =============================================================
  # 1. Linux Victim Target (DVWA, SSH, vsftpd)
  # =============================================================
  linux-victim:
    build: ./linux-victim
    image: soc-lab/linux-victim:1.0.0
    hostname: linux-victim
    environment: {LAB_PASSWORD: "${LAB_PASSWORD:-SocLabPass123!}"}
    volumes: [linux-logs:/var/log]
    networks: [lab]
    ports: ["0.0.0.0:8080:80"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8081/health && pgrep -x sshd && pgrep -x vsftpd"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    logging: *logging

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION:-8.19.4}
    user: root
    command: [filebeat, -e, --strict.perms=false]
    volumes:
      - ./linux-victim/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - linux-logs:/var/log/victim:ro
      - filebeat-data:/usr/share/filebeat/data
    networks: [lab]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    logging: *logging

  # =============================================================
  # 2. Windows Target (SMB LabShare, SSH, IIS FTP, Winlog Telemetry)
  # =============================================================
  windows:
    build: ./windows
    image: soc-lab/windows:1.0.0
    hostname: SOC-WINDOWS
    environment:
      LAB_PASSWORD: "${LAB_PASSWORD:-SocLabPass123!}"
    volumes:
      - windows-data:/storage
    networks:
      lab:
        aliases:
          - windows-target
    ports: ["0.0.0.0:8006:8006"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    logging: *logging

  # =============================================================
  # 3. Kali Linux Attacker Box
  # =============================================================
  kali:
    build: ./kali
    image: soc-lab/kali:1.0.0
    hostname: kali
    environment:
      LAB_PASSWORD: "${LAB_PASSWORD:-SocLabPass123!}"
    networks: [lab]
    volumes: [kali-logs:/logs]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    logging: *logging

  kali-filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION:-8.19.4}
    user: root
    command: [filebeat, -e, --strict.perms=false]
    volumes:
      - ./kali/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - kali-logs:/logs:ro
      - kali-beat-data:/usr/share/filebeat/data
    networks: [lab]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    logging: *logging

networks:
  lab:
    name: soc-lab-net

volumes:
  linux-logs:
  filebeat-data:
  windows-data:
  kali-logs:
  kali-beat-data:
